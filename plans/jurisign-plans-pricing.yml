tax_note: >-
  Subscription and Pack 100 prices are displayed HT (excluding 20% French VAT). SMS OTP token packs and JuriSign
  Flash are displayed TTC (VAT included). The site states this distinction explicitly in its pricing FAQ.
billing_note: >-
  Priced per organization, not per user. Monthly prices for START, Solo, Equipe and Professionnel are the annual
  commitment rate; the developer-page estimator states annual commitment is 15% cheaper than monthly. No credit
  card is required for the sandbox or the free trial.
api_access_note: >-
  API access is not tiered. The developer page states "Chaque capacite est accessible des le premier jeton - nous
  ne bridons jamais un client API par son forfait" (every capability is available from the first token; an API
  client is never limited by its plan). The plan governs signature volume and options, not endpoint access. The
  comparison table does gate Webhooks off the free Decouverte tier and the Pack 100.
