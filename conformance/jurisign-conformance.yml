domain_standard:
  standard: eIDAS - Regulation (EU) No 910/2014
  level: SES (Simple Electronic Signature / Signature Electronique Simple)
  declared_in_contract: true
  evidence:
    location: openapi/jurisign-api-openapi.yml#/info/description
    quote: 'Electronic signature API (eIDAS SES level) with OTP verification (email or SMS).'
  corroboration:
  - location: https://www.jurisign.fr/tarifs
    quote: 'eIDAS SES (UE) N°910/2014'
  - location: https://www.jurisign.fr/sous-traitance
    quote: >-
      "JuriSign fournit une signature electronique simple (SES) au sens du reglement eIDAS. PCFRANCE n'a pas la
      qualite de prestataire de services de confiance qualifie et ne delivre ni signature avancee ni signature
      qualifiee."
  scope_limit_declared: true
  scope_limit_note: >-
    This is the honest and unusual part. The provider states in its own DPA that it is NOT a qualified trust
    service provider and issues neither advanced (AdES) nor qualified (QES) signatures, and tells the customer to
    check that SES suits the acts being signed. A buyer needing AdES/QES under eIDAS Article 25/26 cannot use this
    API, and JuriSign says so rather than leaving it ambiguous.
  eu_trusted_list: not listed (consistent with the provider's own non-qualified declaration)

