agent_safety_notes:
- >-
  send_sign_request is the consequential boundary. Creating a request is free and silent; sending it spends a
  signature credit, emails or SMSes real people, and can only be reversed with cancel while status is pending.
- >-
  create_sign_request accepts an Idempotency-Key honoured for 24 hours, so a retried tool call cannot double-bill
  or double-notify.
- >-
  A sandbox_-prefixed token makes every one of these tools safe to rehearse: identical responses, no messages, no
  credits, webhooks still fire.
