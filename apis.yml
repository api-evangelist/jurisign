apis:
  - name: JuriSign REST API
    description: >-
      Documented, versioned REST API (OpenAPI 3.0.3, 46 operations across 8 tags) for eIDAS SES electronic
      signatures: documents, sign requests, templates, bulk campaigns, public forms, account credits, webhooks
      and authentication. Bearer token auth with five restrictable scopes, an Idempotency-Key on sign-request
      creation, page-number pagination, and a free sandbox token flow that neutralises real delivery and billing
      while still firing webhooks.
