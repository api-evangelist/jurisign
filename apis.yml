name: JuriSign
aid: jurisign
description: >-
  eIDAS electronic signature API developed in France by PCFrance and hosted in Europe. JuriSign issues Simple Electronic Signatures (SES) under eIDAS Regulation (EU) No 910/2014 only -- not advanced (AdES) and not qualified (QES). The 46-operation
  REST contract covers PDF upload with multi-file merge, multi-signer signature requests with email or SMS OTP
  verification, pixel-placed signature zones, reusable templates, bulk campaigns, shareable public self-signing
  forms, pay-at-signature collection through Stripe Connect, HMAC-signed webhooks across twelve events, and
  download of both the signed PDF and its SHA-256 chained audit proof. Signature level is Simple Electronic
  Signature (SES) under eIDAS Regulation (EU) 910/2014; the provider states in its own GDPR Article 28 annex that
  it is not a qualified trust service provider and issues neither advanced nor qualified signatures. Bearer
  tokens carry one of five restrictable scopes, an Idempotency-Key makes the billable write safely repeatable,
  and a free sandbox needs no credit card. All data stays in the European Union.
