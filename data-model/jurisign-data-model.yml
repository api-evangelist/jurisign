    via: GET /webhooks/{id}/logs
- name: WebhookLog
  schema: WebhookLog
  description: One delivery attempt record - the event, its outcome, the receiver's status code, attempt count and next retry time.
  fields: [id, event, status, response_status, attempts, next_retry_at, created_at]
  id_type: integer
  status_values: [success, pending, failed]
  relationships:
