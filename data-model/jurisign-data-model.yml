    target: WebhookEndpoint
supporting_shapes:
- name: Pagination
  description: The meta block on every collection response - current_page, last_page, per_page, total.
- name: MessageResponse
  description: 'The bare {"message": "..."} shape returned by action endpoints.' 
- name: CreateSignRequestInput
  description: The write shape for a signature request - document_id, signers[], zones[], payment, metadata, expiry and ordering.
core_flow:
  description: The three-call spine the provider documents on its own developer page.
  steps:
  - Upload a document (POST /documents) -> Document.id
  - Create a signature request against it (POST /sign-requests) -> SignRequest in draft
  - Send it (POST /sign-requests/{id}/send), or set auto_send:true on creation to collapse the two
  - Track via webhooks, then download the signed PDF and the audit proof
  critical_note: >-
    Creation does not notify anyone. A request stays in draft until send is called - the provider flags this as
    the single most common integration mistake.
