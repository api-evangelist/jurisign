versioning:
  style: uri-path
  current_version: v1
  path_prefix: /api/v1
  spec_version: 3.0.3
  spec_info_version: 3.24.1
  product_version: 3.24.1
  product_version_source: Site footer and pricing-page footer, both reading "v3.24.1" on 2026-08-31.
  note: >-
    The OpenAPI `info.version` tracks the product release number (3.24.1) rather than the API contract version,
    which is carried in the URI path as v1. There is one path version and it has never been superseded.
deprecation:
  policy_published: false
  deprecated_operations: []
  sunset_header: false
  deprecation_header: false
  rfc8594: false
  note: >-
    No deprecation or sunset policy is published on the developer page, the integration guide or in the CGU/CGV,
    and the 46-operation spec carries no `deprecated: true` flag, no Sunset header and no Deprecation header
    anywhere. Recorded as absent, which is what was found - not as a policy that exists but was not located.
  backwards_compatibility_evidence:
  - change: Multi-file upload via files[]
    note: >-
      The provider added files[] alongside the existing singular `file` field and states explicitly that the
      singular field "ne change pas" / "continue de fonctionner a l'identique : rien a changer dans une
      integration existante" - an additive change with the old shape preserved.
    source: https://www.jurisign.fr/api/guide
  - change: Token scopes
    note: >-
      Scopes were introduced with an all-5-scopes default so existing integrations keep working - "Omit to
      receive all 5 scopes (default, unchanged behavior for existing integrations)."
    source: openapi/jurisign-api-openapi.yml#/paths/~1auth~1token/post
